<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google-site-verification" content="38T_Kf4-TLcJcYhli5vWLZ8zQFgzlLNCSyBLaZKwdqg" />
  <meta name="msvalidate.01" content="618D82CE4B8AEFBE10CF7AF9BE59F6FC" />
  <title>Free Chrome Screen Recorder — No Watermarks, 4K | SnapRec</title>
  <meta name="google-adsense-account" content="ca-pub-2862976014228405">
  <meta name="application-name" content="SnapRec" />
  <meta name="author" content="Ghulam Muhammad" />
  <!-- SEO W3: the hardcoded robots meta was removed from here.
       components/SEO.tsx owns robots per route via Helmet; keeping a static
       "index, follow" here put two conflicting robots tags on every noindex page. -->

  <!-- Preconnect to Google Fonts (Material Symbols only — UI fonts are self-hosted) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- SEO C1: the og-image preload hint was removed from here.
       It fetched a 6.4 MB image at highest priority on every route for something no
       page ever renders — it only competed with the real LCP element. The OG image is
       now a 129 KB 1200x630 JPEG, referenced from components/SEO.tsx only. -->

  <!-- Material Symbols (non-render-blocking) -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" /></noscript>
  <!-- Schibsted Grotesk and Azeret Mono are self-hosted via @snaprec/design-system. -->

  <!-- SEO W7: the unconditional AdSense tag was removed from this head.
       components/AdSenseLoader.tsx now injects it, and only after the visitor has
       accepted cookies. The google-adsense-account meta above is enough for
       ownership verification and costs nothing at runtime. -->
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
