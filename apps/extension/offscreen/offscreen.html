<!DOCTYPE html>
<html>

<head>
    <title>SnapRec Offscreen Recording</title>
</head>

<body>
    <!-- This page handles MediaRecorder in the background, persisting across tab navigations -->
    <!-- resolution.js must load first: it defines globalThis.SnapRecResolution,
         which offscreen.js reads when building the capture constraints. -->
    <script src="resolution.js"></script>
    <!-- fullpage.js first: it defines globalThis.SnapRecFullPage, which
         offscreen.js reads to size the stitched canvas and its thumbnail. -->
    <script src="../background/fullpage.js"></script>
    <!-- upload-parts.js defines globalThis.SnapRecParts, which offscreen.js
         reads to decide when a buffer has become a part. -->
    <script src="../background/upload-parts.js"></script>
    <script src="offscreen.js"></script>
</body>

</html>
